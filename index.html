<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#173a3b" />
<title>2026 設計長壽社會｜發表人</title>
<meta name="description" content="2026 設計長壽社會：高齡社會的勞動、福祉與創新國際研討會—發表人與摘要" />
<link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">2026 DESIGNING LONGEVITY</div>
    <div class="hero-title-row">
      <h1>發表人</h1>
      <div class="hero-en">PRESENTERS</div>
    </div>
    <p>2026 設計長壽社會：高齡社會的勞動、福祉與創新國際研討會</p>
  </div>
</header>

<main>
  <section class="intro">
    <div>
      <p class="intro-kicker">PRESENTERS & ABSTRACTS</p>
      <h2>選擇發表人查看摘要</h2>
    </div>
    <p class="intro-note">點選姓名即可查看論文題目、摘要與關鍵詞。</p>
  </section>

  <section class="tools" aria-label="發表人搜尋與篩選">
    <label class="searchbox">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="q" type="search" placeholder="搜尋發表人或論文題目" autocomplete="off">
    </label>
    <div class="filter-row">
      <div class="filters" id="dateFilters" aria-label="日期">
        <button class="chip active" data-date="全部">全部日期</button>
        <button class="chip" data-date="10/1">10/1</button>
        <button class="chip" data-date="10/2">10/2</button>
        <button class="chip" data-date="10/3">10/3</button>
      </div>
      <div class="filters" id="typeFilters" aria-label="發表類型">
        <button class="chip active" data-type="全部">全部</button>
        <button class="chip" data-type="論文發表">論文發表</button>
        <button class="chip" data-type="海報發表">海報發表</button>
      </div>
    </div>
    <div class="result-count"><strong id="count">0</strong> 位發表人</div>
  </section>

  <section id="directory" class="directory" aria-live="polite"></section>
  <div id="empty" class="empty" hidden>找不到符合條件的發表人。</div>
</main>

<footer>
  <span>2026 Designing Longevity</span>
  <span class="footer-dot">·</span>
  <span>Presenter Directory</span>
</footer>

<div id="modal" class="modal" hidden>
  <div class="backdrop" data-close></div>
  <article class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="close" data-close aria-label="關閉">×</button>
    <div id="modalBody"></div>
  </article>
</div>

<script src="app.js?v=4"></script>
</body>
</html>
