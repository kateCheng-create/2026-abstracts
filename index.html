<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#163c3b" />
<title>2026 設計長壽社會｜議程與發表摘要</title>
<meta name="description" content="2026 設計長壽社會國際研討會議程與發表摘要" />
<link rel="stylesheet" href="style.css?v=8" />
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">2026 DESIGNING LONGEVITY</div>
    <h1>設計長壽社會</h1>
    <p class="hero-en">DESIGNING LONGEVITY</p>
    <p class="hero-sub">高齡社會的勞動、福祉與創新國際研討會</p>
  </div>
</header>

<nav class="main-nav" aria-label="網站主要內容">
  <div class="nav-inner">
    <button class="nav-tab active" data-view="schedule">議程 <span>Schedule</span></button>
    <button class="nav-tab" data-view="abstracts">發表摘要 <span>Abstracts</span></button>
  </div>
</nav>

<main>
  <section id="scheduleView" class="view active">
    <div class="section-intro">
      <div><p class="kicker">PROGRAM</p><h2>研討會議程</h2></div>
      <p>點選橘色姓名可直接查看該發表人的摘要。</p>
    </div>
    <div class="day-tabs" id="scheduleDayTabs"></div>
    <div id="scheduleWrap"></div>
    <p class="schedule-note">※ 公告版僅列主要議程、場次與已確認人員；議程如有調整，以大會最新公告為準。</p>
  </section>

  <section id="abstractsView" class="view" hidden>
    <div class="section-intro">
      <div><p class="kicker">PRESENTERS & ABSTRACTS</p><h2>發表摘要</h2></div>
      <p>可依日期、類型或姓名搜尋；點選卡片查看完整摘要。</p>
    </div>
    <section class="tools" aria-label="摘要搜尋與篩選">
      <label class="searchbox"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="搜尋發表人、題目或關鍵字" autocomplete="off"></label>
      <div class="filters"><button class="chip active" data-date="全部">全部日期</button><button class="chip" data-date="10/1">10/1</button><button class="chip" data-date="10/2">10/2</button><button class="chip" data-date="10/3">10/3</button></div>
      <div class="filters"><button class="chip active" data-type="全部">全部類型</button><button class="chip" data-type="論文發表">論文發表</button><button class="chip" data-type="海報發表">海報發表</button></div>
      <div class="result-count"><strong id="count">0</strong> 篇摘要</div>
    </section>
    <div id="abstractGrid" class="abstract-grid"></div>
    <div id="empty" class="empty" hidden>找不到符合條件的摘要。</div>
  </section>
</main>

<footer>2026 Designing Longevity · Program & Abstracts</footer>

<div id="modal" class="modal" hidden>
  <div class="backdrop" data-close></div>
  <article class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="close" data-close aria-label="關閉">×</button>
    <div id="modalBody"></div>
  </article>
</div>

<script src="app.js?v=8"></script>
</body>
</html>
